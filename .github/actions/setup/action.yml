name: Setup
description: Node, pnpm and npm caches, and the Playwright Chromium the checker drives (as markless-migrate's own CI sets them up)
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.2
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.local/share/pnpm/store
        key: ecosystem-deps-${{ runner.os }}-${{ hashFiles('ecosystem-ci/migrate.json', 'migrate.json') }}
        restore-keys: ecosystem-deps-${{ runner.os }}-
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ecosystem-playwright-${{ runner.os }}-${{ hashFiles('ecosystem-ci/migrate.json', 'migrate.json') }}
        restore-keys: ecosystem-playwright-${{ runner.os }}-
